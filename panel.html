<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Panel</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="points-display">
                <span class="points-icon">💎</span>
                <span class="points-value" id="pointsValue">0</span>
            </div>
            <div class="points-label">Your Points</div>
        </div>

        <div class="tabs" id="tabContainer">
            <button class="tab active" data-tab="main">Main</button>
            <button class="tab" data-tab="shop">Shop</button>
        </div>

        <div class="content">
            <div id="mainTab" class="tab-content active">
                <div class="team-info">
                    <div id="currentTeam" class="current-team" style="display: none;">
                        <h2>Your Team</h2>
                        <div class="team-badge" id="teamBadge"></div>
                    </div>

                    <div id="teamSelection" class="team-selection">
                        <h2>Choose Your Team</h2>
                        <p style="color: #adadb8; margin-bottom: 20px;">Select a team to join the battle!</p>
                        
                        <div class="team-options" id="teamOptions">
                            <div class="team-option team-1" data-team="1">
                                <div class="team-icon">🔴</div>
                                <div class="team-name">Team 1</div>
                                <div class="team-count"><span id="team1Count">0</span> players</div>
                            </div>
                            
                            <div class="team-option team-2" data-team="2">
                                <div class="team-icon">🔵</div>
                                <div class="team-name">Team 2</div>
                                <div class="team-count"><span id="team2Count">0</span> players</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="shopTab" class="tab-content">
                <div class="shop-grid" id="shopGrid">
                    </div>
            </div>
        </div>
    </div>

    <script src="panel.js"></script>
</body>
</html>
